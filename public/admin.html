<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="管理后台">
  <title>打卡管理后台</title>
  <link rel="manifest" href="manifest-admin.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=20261002">
  <style>
    body { background: #f5f6fa; }
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .admin-header h1 { font-size: 22px; }
    .admin-header a { color: var(--primary); text-decoration: none; font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .stat-num { font-size: 28px; font-weight: 700; color: var(--primary); }
    .stat-label { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .panel { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.05); margin-bottom: 24px; }
    .panel h2 { font-size: 16px; margin-bottom: 12px; }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; min-width: 640px; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
    th { background: #fafafa; font-weight: 600; font-size: 13px; color: var(--muted); position: sticky; top: 0; }
    tr:hover td { background: #fafbff; }
    .addr-cell { max-width: 280px; font-size: 12px; color: var(--muted); white-space: normal; word-break: break-all; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 6px; background: var(--primary-light); color: var(--primary); font-size: 12px; font-weight: 600; }
    .btn-del { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 13px; padding: 4px 8px; }
    .filter-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
    .filter-row input { padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
    .filter-row input:focus { border-color: var(--primary); }
    .btn-export { background: var(--success); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
    .btn-export:active { transform: scale(.97); }
    .btn-logout { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; margin-left: 12px; }
    .btn-edit { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 13px; padding: 4px 8px; margin-right: 8px; }
    .btn-edit:active { opacity: .6; }

    /* 编辑弹窗 */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
    .modal { position: relative; inset: auto; background: #fff; border-radius: 16px; padding: 24px; max-width: 420px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,.15); display: block; max-height: 90vh; overflow-y: auto; }
    .modal h3 { margin-bottom: 16px; font-size: 18px; }
    .modal .field { margin-bottom: 14px; }
    .modal label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .modal input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box; }
    .modal input:focus { border-color: var(--primary); }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button { flex: 1; padding: 11px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; }
    .btn-cancel { background: #f0f0f0; color: #333; }
    .btn-save { background: var(--primary); color: #fff; }

    /* 登录页 */
    .login-wrap { max-width: 380px; margin: 80px auto; padding: 24px; }
    .login-card { background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
    .login-card h1 { text-align: center; margin-bottom: 8px; }
    .login-card .muted { text-align: center; margin-bottom: 24px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="watermark" class="watermark"></div>
  <!-- 登录页 -->
  <div id="login-screen" class="login-wrap">
    <div class="login-card">
      <h1>🔐 管理后台登录</h1>
      <p class="muted">请输入管理员账号和密码</p>
      <input id="login-username" class="input" type="text" placeholder="管理员账号" autocomplete="username" style="margin-bottom:12px" value="admin">
      <input id="login-password" class="input" type="password" placeholder="管理员密码" autocomplete="current-password">
      <div id="login-error" style="color:var(--danger);font-size:13px;margin:8px 0;min-height:18px"></div>
      <button id="btn-login" class="btn btn-primary">登录</button>
      <p class="muted" style="margin-top:16px;font-size:12px">仅限管理员访问</p>
    </div>
  </div>

  <!-- 后台内容 -->
  <div id="admin-content" class="admin-wrap hidden">
    <div class="admin-header">
      <h1>📋 打卡管理后台</h1>
      <div>
        <a href="index.html">← 返回打卡</a>
        <button id="btn-change-pwd" class="btn-logout">修改密码</button>
        <button id="btn-logout" class="btn-logout">退出登录</button>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <!-- 请假通知 -->
    <div class="panel" id="panel-leaves" style="border-left:4px solid #e67e22">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h2 style="margin:0">📝 请假记录 <span id="leave-badge" style="background:#e67e22;color:#fff;border-radius:10px;padding:1px 9px;font-size:13px;vertical-align:middle">0</span></h2>
      </div>
      <div id="leaves-list"></div>
    </div>

    <!-- 管理员管理（仅超管可见） -->
    <div class="panel" id="panel-admins" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 style="margin:0">🛡️ 管理员管理</h2>
        <button id="btn-add-admin" class="btn-export" style="background:var(--primary)">+ 添加管理员</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>账号</th><th>角色</th><th>创建时间</th><th>操作</th></tr></thead>
          <tbody id="admins-body"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h2>👥 人员管理</h2>
      <div class="filter-row">
        <input id="filter-person" placeholder="搜索成员姓名" style="flex:1;min-width:200px">
      </div>
      <div id="persons-container"></div>
    </div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 style="margin:0">所有群组</h2>
        <div style="display:flex;gap:8px">
          <button id="btn-export" class="btn-export">📥 导出 Excel</button>
          <button id="btn-create-group" class="btn-export" style="background:var(--primary)">+ 创建群组</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>群组名</th><th>邀请码</th><th>打卡范围</th><th>打卡时段</th><th>打卡数</th><th>创建时间</th><th>操作</th></tr></thead>
          <tbody id="groups-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 编辑弹窗 -->
  <div id="edit-modal" class="modal-mask hidden">
    <div class="modal">
      <h3 id="modal-title">编辑</h3>
      <div id="modal-fields"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="modal-cancel">取消</button>
        <button class="btn-save" id="modal-save">保存</button>
      </div>
    </div>
  </div>

  <!-- 添加管理员弹窗 -->
  <div id="admin-modal" class="modal-mask hidden">
    <div class="modal">
      <h3>添加管理员</h3>
      <div class="field">
        <label>管理员账号</label>
        <input id="adm-username" type="text" placeholder="登录账号">
      </div>
      <div class="field">
        <label>密码（至少6位）</label>
        <input id="adm-password" type="password" placeholder="登录密码">
      </div>
      <div id="adm-error" style="color:var(--danger);font-size:13px;min-height:18px"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="adm-cancel">取消</button>
        <button class="btn-save" id="adm-save">确认添加</button>
      </div>
    </div>
  </div>

  <!-- 修改密码弹窗 -->
  <div id="pwd-modal" class="modal-mask hidden">
    <div class="modal">
      <h3>修改管理员密码</h3>
      <div class="field">
        <label>旧密码</label>
        <input id="pwd-old" type="password" placeholder="请输入当前密码">
      </div>
      <div class="field">
        <label>新密码（至少6位）</label>
        <input id="pwd-new" type="password" placeholder="请输入新密码">
      </div>
      <div class="field">
        <label>确认新密码</label>
        <input id="pwd-confirm" type="password" placeholder="请再次输入新密码">
      </div>
      <div id="pwd-error" style="color:var(--danger);font-size:13px;min-height:18px"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="pwd-cancel">取消</button>
        <button class="btn-save" id="pwd-save">确认修改</button>
      </div>
    </div>
  </div>

  <!-- 创建群组弹窗 -->
  <div id="create-group-modal" class="modal-mask hidden">
    <div class="modal">
      <h3>创建打卡群组</h3>
      <div class="field">
        <label>群组名称</label>
        <input id="cg-name" type="text" placeholder="如：晨跑小队" maxlength="30">
      </div>
      <div class="field">
        <label>📍 定位或地址识别</label>
        <div style="display:flex;gap:8px">
          <button type="button" class="btn-save" id="cg-loc-btn" style="flex:1;padding:10px;font-size:13px">使用当前位置</button>
        </div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <input id="cg-addr" type="text" placeholder="输入地址自动识别坐标" style="flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline: none;box-sizing:border-box">
          <button type="button" class="btn-save" id="cg-geo-btn" style="flex:none;padding:10px 14px;font-size:13px">识别</button>
        </div>
        <div id="cg-addr-result" style="font-size:12px;color:var(--success);margin-top:4px;min-height:16px"></div>
      </div>
      <div class="field">
        <label>中心点纬度（不限制留空）</label>
        <input id="cg-lat" type="text" placeholder="如 39.904">
      </div>
      <div class="field">
        <label>中心点经度（不限制留空）</label>
        <input id="cg-lng" type="text" placeholder="如 116.407">
      </div>
      <div class="field">
        <label>打卡范围（米，0=不限制）</label>
        <input id="cg-radius" type="number" value="0" min="0" max="100000">
      </div>
      <div id="cg-error" style="color:var(--danger);font-size:13px;min-height:18px"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cg-cancel">取消</button>
        <button class="btn-save" id="cg-save">创建</button>
      </div>
    </div>
  </div>

  <!-- 邀请弹窗 -->
  <div id="invite-modal" class="modal-mask hidden">
    <div class="modal">
      <h3>邀请成员加入</h3>
      <p class="muted" style="font-size:13px;margin-bottom:12px">把邀请码或链接发给成员，成员在打卡 App 输入邀请码即可加入</p>
      <div class="field">
        <label>群组</label>
        <div id="invite-group-name" style="font-weight:600;font-size:16px"></div>
      </div>
      <div class="field">
        <label>邀请码</label>
        <div style="display:flex;gap:8px;align-items:center">
          <div id="invite-code" style="flex:1;padding:12px;background:var(--primary-light);color:var(--primary);border-radius:8px;font-size:20px;font-weight:700;letter-spacing:4px;text-align:center;font-family:monospace"></div>
          <button class="btn-save" id="btn-copy-code" style="flex:none;padding:12px 16px">复制</button>
        </div>
      </div>
      <div class="field">
        <label>邀请链接</label>
        <div style="display:flex;gap:8px;align-items:center">
          <div id="invite-link" style="flex:1;padding:10px;background:#f5f5f5;border-radius:8px;font-size:12px;color:var(--muted);word-break:break-all;max-height:60px;overflow:auto"></div>
          <button class="btn-save" id="btn-copy-link" style="flex:none;padding:12px 16px">复制</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="invite-close">关闭</button>
        <button class="btn-save" id="btn-share" style="display:none">系统分享</button>
      </div>
    </div>
  </div>

  <!-- 休息设置弹窗 -->
  <div id="rest-modal" class="modal-mask hidden">
    <div class="modal">
      <h3>🛌 设置群休息</h3>
      <p class="muted" style="font-size:13px;margin-bottom:12px">群组：<b id="rest-group-name"></b></p>
      <div class="field">
        <label>休息方式</label>
        <select id="rest-mode" class="input" style="margin-bottom:8px">
          <option value="days">按天数（从现在开始）</option>
          <option value="range">按时间段</option>
        </select>
      </div>
      <div id="rest-days-box" class="field">
        <label>休息天数</label>
        <input id="rest-days" class="input" type="number" min="0.5" step="0.5" value="1" placeholder="如 1 表示休息1天">
      </div>
      <div id="rest-range-box" class="field" style="display:none">
        <label>开始时间</label>
        <input id="rest-start" class="input" type="datetime-local" style="margin-bottom:8px">
        <label>结束时间</label>
        <input id="rest-end" class="input" type="datetime-local">
      </div>
      <div class="field">
        <label>休息原因（可选，将推送给成员）</label>
        <input id="rest-reason" class="input" type="text" placeholder="如：国庆假期、项目休整等">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="rest-cancel">取消</button>
        <button class="btn-save" id="rest-confirm">确认休息</button>
      </div>
    </div>
  </div>

  <!-- 人员详情弹窗 -->
  <div id="person-modal" class="modal-mask hidden">
    <div class="modal" style="max-width:520px">
      <h3 id="person-modal-title">成员详情</h3>
      <p class="muted" style="font-size:13px;margin-bottom:10px">群组：<b id="person-modal-group"></b></p>
      <div id="person-modal-stats" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"></div>
      <div id="person-modal-today" style="display:flex;gap:6px;margin-bottom:14px"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:14px;font-weight:600">打卡记录</div>
        <button class="btn-edit" id="person-makeup-btn" style="color:#0277bd">🔧 补卡</button>
      </div>
      <div id="person-records" style="max-height:45vh;overflow-y:auto"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="person-modal-close" style="flex:1">关闭</button>
      </div>
    </div>
  </div>

  <!-- 补卡弹窗 -->
  <div id="makeup-modal" class="modal-mask hidden">
    <div class="modal">
      <h3>🔧 为成员补卡</h3>
      <p class="muted" style="font-size:13px;margin-bottom:12px">成员：<b id="makeup-user"></b>　群组：<b id="makeup-group"></b></p>
      <div class="field">
        <label>补卡时间（按此时间自动归属卡种，状态记为正常）</label>
        <input id="makeup-time" class="input" type="datetime-local">
      </div>
      <div id="makeup-slot-preview" style="font-size:13px;margin-bottom:14px;color:var(--primary)"></div>
      <div class="field">
        <label>补卡原因（可选，成员可见）</label>
        <input id="makeup-reason" class="input" type="text" placeholder="如：忘记打卡、设备故障等">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="makeup-cancel" style="flex:1">取消</button>
        <button class="btn-save" id="makeup-confirm" style="flex:1">确认补卡</button>
      </div>
    </div>
  </div>

  <script src="admin.js?v=20261002"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
